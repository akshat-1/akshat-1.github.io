<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Akshat Porwal placeholder avatar</title>
  <desc id="desc">A geometric cyan and violet avatar marked AP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12283d"/>
      <stop offset="0.55" stop-color="#11172d"/>
      <stop offset="1" stop-color="#311a42"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67f3d2"/>
      <stop offset="1" stop-color="#9580ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="800" rx="72" fill="url(#bg)"/>
  <g opacity=".25" stroke="#67f3d2" fill="none">
    <path d="M0 150h800M0 300h800M0 450h800M0 600h800M150 0v800M300 0v800M450 0v800M600 0v800"/>
  </g>
  <circle cx="400" cy="400" r="220" fill="none" stroke="url(#ring)" stroke-width="10" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="170" fill="#0a1022" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
  <text x="400" y="452" fill="#f4fbff" font-family="Arial, sans-serif" font-size="170" font-weight="800" text-anchor="middle" letter-spacing="-12">AP</text>
  <circle cx="664" cy="136" r="8" fill="#67f3d2"/><circle cx="126" cy="634" r="6" fill="#9580ff"/>
</svg>
